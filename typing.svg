<svg xmlns="http://www.w3.org/2000/svg" width="700" height="150" viewBox="0 0 700 150">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0">
      <stop offset="0%" stop-color="#A371F7">
        <animate attributeName="stop-color" values="#A371F7;#58A6FF;#3FB950;#F778BA;#A371F7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#3FB950;#F778BA;#A371F7;#58A6FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3FB950">
        <animate attributeName="stop-color" values="#3FB950;#F778BA;#A371F7;#58A6FF;#3FB950" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <clipPath id="c1"><rect x="135" y="0" height="150" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
               keyTimes="0;0.15625;0.94;0.941;1" values="0;430;430;0;0"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="114" y="0" height="150" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
               keyTimes="0;0.21875;0.375;0.94;0.941;1" values="0;0;472;472;0;0"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="143" y="0" height="150" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
               keyTimes="0;0.4375;0.59375;0.94;0.941;1" values="0;0;414;414;0;0"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="71" y="0" height="150" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite"
               keyTimes="0;0.65625;0.8125;0.94;0.941;1" values="0;0;558;558;0;0"/>
    </rect></clipPath>
  </defs>

  <g font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="24" font-weight="600"
     text-anchor="middle" fill="url(#g)">
    <text x="350" y="30"  clip-path="url(#c1)">Hey! I'm Subham Maharana 👋</text>
    <text x="350" y="65"  clip-path="url(#c2)">AI Engineer | Python Developer</text>
    <text x="350" y="100" clip-path="url(#c3)">ML → GenAI → Agentic AI 🤖</text>
    <text x="350" y="135" clip-path="url(#c4)">Let's build something intelligent 🚀</text>
  </g>
</svg>
